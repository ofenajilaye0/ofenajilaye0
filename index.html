<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b0000">
  <meta name="robots" content="index,follow">
  <title>Chicken Road</title>
  <meta name="description" content="Chicken Road – jetzt entdecken.">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #2b0000;
      overflow-x: hidden;
    }

    .page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #2b0000;
    }

    .creative {
      display: block;
      width: 100%;
      min-height: 100svh;
      cursor: pointer;
      text-decoration: none;
      outline: none;
    }

    .creative:focus-visible {
      outline: 3px solid #fff;
      outline-offset: -3px;
    }

    .creative__image {
      display: block;
      width: 100%;
      min-height: 100svh;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 640px) {
      .creative__image {
        object-fit: cover;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <a
      id="landing-link"
      class="creative"
      href="http://barnwelllead.pro/"
      aria-label="Chicken Road öffnen"
      rel="noopener"
    >
      <img
        class="creative__image"
        src="./image.webp"
        alt="Chicken Road"
        width="1916"
        height="935"
        loading="eager"
        decoding="async"
      >
    </a>
  </main>

  <script>
    (() => {
      const link = document.getElementById("landing-link");
      if (!link) return;

      const destination = new URL("http://barnwelllead.pro/");
      const incoming = new URLSearchParams(window.location.search);

      [
        "utm_source",
        "utm_medium",
        "utm_campaign",
        "utm_term",
        "utm_content",
        "utm_id",
        "gclid",
        "gbraid",
        "wbraid",
        "fbclid",
        "msclkid"
      ].forEach((key) => {
        const value = incoming.get(key);
        if (value !== null && value !== "") {
          destination.searchParams.set(key, value);
        }
      });

      link.href = destination.toString();
    })();
  </script>
</body>
</html>
